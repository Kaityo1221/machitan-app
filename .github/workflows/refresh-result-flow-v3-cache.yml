name: Refresh result flow v3 cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-result-flow-v3-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh result flow script version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\.\/result-flow-v3\.js\?v=[^"\']+', './result-flow-v3.js?v=20260809-2326', text)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "結果演出v3のキャッシュを更新"
          git push origin main
