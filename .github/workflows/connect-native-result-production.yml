name: Connect native result production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-native-result-production.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-entry-prototype
          fetch-depth: 0

      - name: Connect event seed and native area value
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/index.tsx')
          text = p.read_text(encoding='utf-8')

          old_import = "import { MeasurementResultScreen } from '../src/components/MeasurementResultScreen';"
          new_import = "import { useEventSession } from '../src/components/EventEntryGate';\nimport { MeasurementResultScreen } from '../src/components/MeasurementResultScreen';"
          if old_import not in text:
              raise SystemExit('MeasurementResultScreen import not found')
          text = text.replace(old_import, new_import, 1)

          old_home = "export default function HomeScreen() {\n  useKeepAwake();"
          new_home = "export default function HomeScreen() {\n  useKeepAwake();\n\n  const { activeEvent } = useEventSession();"
          if old_home not in text:
              raise SystemExit('HomeScreen start not found')
          text = text.replace(old_home, new_home, 1)

          old_prop = "        expandedArea={formattedExpandedArea}\n        stageName={townGrowthStage.name}"
          new_prop = "        expandedAreaSquareMeters={expandedAreaSquareMeters}\n        stageName={townGrowthStage.name}"
          if old_prop not in text:
              raise SystemExit('expandedArea result prop not found')
          text = text.replace(old_prop, new_prop, 1)

          old_event_props = "        discoveredPoiIds={discoveredPoiIds}\n        onStartNewMeasurement={handleResetMeasurement}"
          new_event_props = "        discoveredPoiIds={discoveredPoiIds}\n        eventSeed={activeEvent.primaryCode}\n        onStartNewMeasurement={handleResetMeasurement}"
          if old_event_props not in text:
              raise SystemExit('result event prop location not found')
          text = text.replace(old_event_props, new_event_props, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.tsx
          git commit -m "実機版結果画面へイベント情報を接続"
          git push origin HEAD:feature/event-entry-prototype
