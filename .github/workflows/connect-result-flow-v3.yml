name: Connect result flow v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-result-flow-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect v3 result flow last
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\.\/bonus-map\.js\?v=[^"\']+', './bonus-map.js?v=20260809-1647', text)
          text = re.sub(r'\.\/result-sequence\.js\?v=[^"\']+', './result-sequence.js?v=20260809-1647', text)
          line = '<script src="./result-flow-v3.js?v=20260809-1647"></script>'
          if 'result-flow-v3.js' not in text:
              text = text.replace('</body>', line + '\n</body>')
          else:
              text = re.sub(r'<script src="\.\/result-flow-v3\.js\?v=[^"]+"></script>', line, text)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit connection
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Safari向け結果演出v3を接続"
          git push origin main
