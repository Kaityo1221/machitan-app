name: Hotfix bonus area cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-bonus-area.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch cache-busting script URL and result label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<script src="./bonus-map.js"></script>',
              '<script src="./bonus-map.js?v=20260806-2205"></script>'
          )
          text = text.replace(
              '<div class="stat-label">育てた緑</div><div id="resultArea"',
              '<div class="stat-label">あなたが歩いて育てた面積</div><div id="resultArea"'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "県の面積表示キャッシュを更新"
          git push origin main
