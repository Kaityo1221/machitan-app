name: Refresh result sequence cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-result-sequence-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh result sequence version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\.\/result-sequence\.js\?v=[^"\']+', './result-sequence.js?v=20260808-1619', text)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "おや？演出のキャッシュを更新"
          git push origin main
