name: Attach bonus area display

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/attach-bonus-area.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Attach official area script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="./bonus-map.js?v=20260806-2205"></script>'
          addition = marker + '\n<script src="./bonus-area-v1.js?v=20260806-2244"></script>'

          if 'bonus-area-v1.js' not in text:
              text = text.replace(marker, addition)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched index
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "公式面積表示をWeb結果画面へ接続"
          git push origin main
