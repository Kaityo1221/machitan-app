name: Connect result sequence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/connect-result-sequence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect result sequence script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="./bonus-map.js?v=20260808-1425"></script>\n</body>'
          new = '<script src="./bonus-map.js?v=20260808-1425"></script>\n<script src="./result-sequence.js?v=20260808-1530"></script>\n</body>'
          if old in text:
              text = text.replace(old, new)
          elif 'result-sequence.js' not in text:
              text = text.replace('</body>', '<script src="./result-sequence.js?v=20260808-1530"></script>\n</body>')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit connection
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "結果画面の自動演出を接続"
          git push origin main
