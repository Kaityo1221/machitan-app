name: Validate native result production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-native-result-production.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-entry-prototype
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

      - name: Mark successful validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "実機版結果画面の型チェックとlintを確認"
          git push origin HEAD:feature/event-entry-prototype
