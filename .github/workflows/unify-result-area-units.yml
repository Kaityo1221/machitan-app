name: Unify result area units

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unify-result-area-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unify result wording and units
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace("el.resultArea.textContent=formatArea(area);", "el.resultArea.textContent=`${(area/1000000).toFixed(3)} km²`;" )
          index.write_text(text, encoding='utf-8')

          bonus = Path('bonus-map.js')
          text = bonus.read_text(encoding='utf-8')
          text = text.replace("label.textContent='あなたが歩いて育てた面積'", "label.textContent='あなたが歩いて育てた範囲'")
          text = text.replace('自分が塗りつぶした面積', '自分が塗りつぶした範囲')
          text = text.replace('飛び地ボーナス面積', '飛び地ボーナスの範囲')
          text = text.replace("document.getElementById('areaFinaleWalked').textContent=`${formatWalkedArea(walkedSquareMeters)} (${walkedKm2.toFixed(3)} km²)`;", "document.getElementById('areaFinaleWalked').textContent=`${walkedKm2.toLocaleString('ja-JP',{minimumFractionDigits:3,maximumFractionDigits:3})} km²`;" )
          text = text.replace("document.getElementById('areaFinaleBonus').textContent=formatOfficialArea(info);", "document.getElementById('areaFinaleBonus').textContent=`${info.areaKm2.toLocaleString('ja-JP',{minimumFractionDigits:3,maximumFractionDigits:3})} km²`;" )
          bonus.write_text(text, encoding='utf-8')
          PY
      - name: Refresh bonus map cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'\.\/bonus-map\.js\?v=[^"\']+', './bonus-map.js?v=20260809-1558', text)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html bonus-map.js
          git commit -m "結果画面の範囲表示をkm2へ統一"
          git push origin main
