name: Refresh area finale cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-area-finale.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh bonus map script version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          import re
          text = re.sub(r'\.\/bonus-map\.js\?v=[^"\']+', './bonus-map.js?v=20260808-1254', text)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "総まち面積カウンターのキャッシュを更新"
          git push origin main
