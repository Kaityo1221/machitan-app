name: Rename area finale wording

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-area-to-range.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename finale wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bonus-map.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('今日の総まち面積', 'あなたが広げた範囲')
          text = text.replace('タップして総まち面積を見る', 'タップして広げた範囲を見る')
          text = text.replace('あなたが育てた面積と、賛同した土地の公式面積を合計しています。', 'あなたが歩いて育てた範囲と、賛同した土地の範囲を合わせています。')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit wording update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bonus-map.js
          git commit -m "総まち面積の表現を広げた範囲へ変更"
          git push origin main
