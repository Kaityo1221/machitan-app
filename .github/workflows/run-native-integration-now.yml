name: Run native integration now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-native-integration-now.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/native-production-20260809
          fetch-depth: 0

      - name: Fetch native source branch
        run: git fetch origin feature/event-entry-prototype

      - name: Copy only native production files
        run: |
          git checkout origin/feature/event-entry-prototype -- \
            app/_layout.tsx \
            app/index.tsx \
            src/components/EventEntryGate.tsx \
            src/components/MeasurementResultScreen.tsx \
            src/lib/flyawayBonus.ts \
            src/lib/flyawayBoundary.ts \
            src/lib/townGrowth.ts \
            src/lib/townGrowthShape.ts

      - name: Validate integration
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/_layout.tsx app/index.tsx src/components/EventEntryGate.tsx src/components/MeasurementResultScreen.tsx src/lib/flyawayBonus.ts src/lib/flyawayBoundary.ts src/lib/townGrowth.ts src/lib/townGrowthShape.ts
          if git diff --cached --quiet; then
            echo "No native changes needed"
          else
            git commit -m "実機版をWeb確認版へ安全統合"
            git push origin HEAD:integrate/native-production-20260809
          fi
