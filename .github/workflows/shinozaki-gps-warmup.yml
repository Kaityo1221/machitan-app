name: Apply Shinozaki GPS warmup fix

on:
  push:
    branches:
      - agent/shinozaki-gps-warmup
    paths:
      - .github/workflows/shinozaki-gps-warmup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shinozaki-gps-warmup
      - name: Patch GPS startup flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/index.tsx')
          s = p.read_text()

          s = s.replace("type MeasurementStatus =\n  | 'idle'\n  | 'running'\n  | 'paused'\n  | 'finished';", "type MeasurementStatus =\n  | 'idle'\n  | 'locating'\n  | 'running'\n  | 'paused'\n  | 'finished';")

          s = s.replace("  const locationSubscriptionRef =\n    useRef<Location.LocationSubscription | null>(null);", "  const locationSubscriptionRef =\n    useRef<Location.LocationSubscription | null>(null);\n\n  // 位置情報の許可直後は測位が安定するまで本計測を開始しません。\n  const awaitingFirstFixRef = useRef(false);")

          s = s.replace("      setGpsMessage('GPSを取得中');", "      setGpsMessage('現在地を確認しています…');")

          marker = "    setGpsMessage(\n      `GPS受信中（精度 約${Math.round(\n        accuracy,\n      )}m）`,\n    );\n\n    const movement = evaluateMovement("
          replacement = "    setGpsMessage(\n      `GPS受信中（精度 約${Math.round(\n        accuracy,\n      )}m）`,\n    );\n\n    // 最初の有効な測位を取得できた時点を、本当の計測開始地点にします。\n    // 許可直後の粗いGPSや地下・電車内での測位待ち時間は計測時間に含めません。\n    if (awaitingFirstFixRef.current) {\n      awaitingFirstFixRef.current = false;\n      previousCoordinatesRef.current = nextCoordinates;\n      previousLocationTimestampRef.current = location.timestamp;\n\n      // 開始地点のすぐ近くにあるポイポイは、その場で攻略判定します。\n      discoverPoisAlongMovement(nextCoordinates, nextCoordinates);\n\n      startedAtRef.current = Date.now();\n      setElapsedMilliseconds(accumulatedMillisecondsRef.current);\n      setStatus('running');\n      return;\n    }\n\n    const movement = evaluateMovement("
          if marker not in s:
              raise SystemExit('location marker not found')
          s = s.replace(marker, replacement, 1)

          s = s.replace("  const stopLocationTracking = () => {\n    locationSubscriptionRef.current?.remove();", "  const stopLocationTracking = () => {\n    awaitingFirstFixRef.current = false;\n    locationSubscriptionRef.current?.remove();")

          old_start = "  const handleStart = async () => {\n    accumulatedMillisecondsRef.current = 0;\n    startedAtRef.current = null;\n    distanceMetersRef.current = 0;\n    previousCoordinatesRef.current = null;\n    previousLocationTimestampRef.current = null;\n\n    setElapsedMilliseconds(0);\n    setDistanceMeters(0);\n\n    const trackingStarted =\n      await startLocationTracking();\n\n    if (!trackingStarted) {\n      return;\n    }\n\n    startedAtRef.current = Date.now();\n    setStatus('running');\n  };"
          new_start = "  const handleStart = async () => {\n    accumulatedMillisecondsRef.current = 0;\n    startedAtRef.current = null;\n    distanceMetersRef.current = 0;\n    previousCoordinatesRef.current = null;\n    previousLocationTimestampRef.current = null;\n    awaitingFirstFixRef.current = true;\n\n    setElapsedMilliseconds(0);\n    setDistanceMeters(0);\n    setStatus('locating');\n\n    const trackingStarted =\n      await startLocationTracking();\n\n    if (!trackingStarted) {\n      awaitingFirstFixRef.current = false;\n      setStatus('idle');\n    }\n  };"
          if old_start not in s:
              raise SystemExit('start block not found')
          s = s.replace(old_start, new_start, 1)

          old_resume = "  const handleResume = async () => {\n    previousCoordinatesRef.current = null;\n    previousLocationTimestampRef.current = null;\n\n    const trackingStarted =\n      await startLocationTracking();\n\n    if (!trackingStarted) {\n      return;\n    }\n\n    startedAtRef.current = Date.now();\n    setStatus('running');\n  };"
          new_resume = "  const handleResume = async () => {\n    previousCoordinatesRef.current = null;\n    previousLocationTimestampRef.current = null;\n    awaitingFirstFixRef.current = true;\n    setStatus('locating');\n\n    const trackingStarted =\n      await startLocationTracking();\n\n    if (!trackingStarted) {\n      awaitingFirstFixRef.current = false;\n      setStatus('paused');\n    }\n  };"
          if old_resume not in s:
              raise SystemExit('resume block not found')
          s = s.replace(old_resume, new_resume, 1)

          s = s.replace("    if (status === 'running' || status === 'paused') {", "    if (\n      status === 'locating' ||\n      status === 'running' ||\n      status === 'paused'\n    ) {", 1)
          s = s.replace("    if (status === 'running' || status === 'paused') {", "    if (\n      status === 'locating' ||\n      status === 'running' ||\n      status === 'paused'\n    ) {", 1)

          s = s.replace("  const statusText = {\n    idle: '計測前',\n    running: '計測中',", "  const statusText = {\n    idle: '計測前',\n    locating: '現在地を確認中',\n    running: '計測中',")

          idle_ui = "      {status === 'idle' && (\n        <ActionButton\n          label=\"計測を開始\"\n          onPress={handleStart}\n        />\n      )}\n\n      {status === 'running' && ("
          locating_ui = "      {status === 'idle' && (\n        <ActionButton\n          label=\"計測を開始\"\n          onPress={handleStart}\n        />\n      )}\n\n      {status === 'locating' && (\n        <>\n          <ActionButton\n            label=\"現在地を確認しています…\"\n            onPress={() => {}}\n            disabled\n          />\n\n          <ActionButton\n            label=\"キャンセル\"\n            onPress={handleResetMeasurement}\n            secondary\n          />\n        </>\n      )}\n\n      {status === 'running' && ("
          if idle_ui not in s:
              raise SystemExit('status UI marker not found')
          s = s.replace(idle_ui, locating_ui, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.tsx
          git rm .github/workflows/shinozaki-gps-warmup.yml
          git commit -m "fix: wait for stable GPS before measurement"
          git push origin HEAD:agent/shinozaki-gps-warmup
